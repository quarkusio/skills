name: PR Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  statuses: write

env:
  JAVA_VERSION: '21'

jobs:
  check-paths:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      tests_changed: ${{ steps.detect.outputs.tests_changed }}
      skills_changed: ${{ steps.detect.outputs.skills_changed }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect changed folders
        id: detect
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "tests_changed=true" >> "$GITHUB_OUTPUT"
            echo "skills_changed=false" >> "$GITHUB_OUTPUT"
          else
            tests=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- tests/ | wc -l | tr -d ' ')
            skills=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- skills/ | wc -l | tr -d ' ')
            echo "tests_changed=$( [ "$tests" -gt 0 ] && echo true || echo false )" >> "$GITHUB_OUTPUT"
            echo "skills_changed=$( [ "$skills" -gt 0 ] && echo true || echo false )" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload path metadata
        if: github.event_name == 'pull_request'
        run: |
          mkdir -p /tmp/pr-meta
          echo "${{ steps.detect.outputs.tests_changed }}" > /tmp/pr-meta/tests_changed
          echo "${{ steps.detect.outputs.skills_changed }}" > /tmp/pr-meta/skills_changed

      - uses: actions/upload-artifact@v7
        if: github.event_name == 'pull_request'
        with:
          name: pr-meta
          path: /tmp/pr-meta/
          retention-days: 1

      - name: Set early AI Skill Run status
        if: github.event_name == 'pull_request' && steps.detect.outputs.skills_changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'AI Skill Run',
              description: 'Waiting for PR Check to complete...'
            });

  build-tests:
    name: Build test harness
    needs: check-paths
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v6
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Build test AI framework (unit tests only, no AI integration)
        working-directory: tests
        run: mvn -B package