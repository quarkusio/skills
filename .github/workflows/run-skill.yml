name: Execute AI SKILL using IBM Bob

on:
  workflow_dispatch:

env:
  JAVA_VERSION: '21'

jobs:
  run-bob:
    name: Run ACP Agent with Skill
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out the repository without persisted credentials
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Install ACP client and IBM Bob agent
        uses: ./.github/actions/acp-agent-action
        with:
          bobshell_api_key: ${{ secrets.BOBSHELL_API_KEY }}

      - name: Execute SKILL
        shell: bash
        run: |
          set -euo pipefail

          mvn clean test -Pintegration \
            -Dai.prompt="Say Hello" \
            -Dai.projects=dummy \
            -Dai.skills=../tests/skills/dummy \
            -Dai.review=false
