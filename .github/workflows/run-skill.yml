name: Execute AI SKILL using Smallrye ACP and IBM Bob agent

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["PR Check"]
    types:
      - completed

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  statuses: write
  actions: read
  pull-requests: write

env:
  JAVA_VERSION: '21'

jobs:
  check:
    name: Check if skills changed
    if: >
      github.repository_owner == 'quarkusio' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'))
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.evaluate.outputs.should_run }}
    steps:
      - name: Download PR metadata
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v7
        with:
          name: pr-meta
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Evaluate whether to run
        id: evaluate
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            SKILLS_CHANGED=$(cat skills_changed)
            [[ "$SKILLS_CHANGED" =~ ^(true|false)$ ]] || { echo "::error::Invalid skills_changed value"; exit 1; }
            echo "should_run=$SKILLS_CHANGED" >> "$GITHUB_OUTPUT"
          fi

      - name: Set skipped status
        if: github.event_name == 'workflow_run' && steps.evaluate.outputs.should_run != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: '${{ github.event.workflow_run.head_sha }}',
              state: 'success',
              context: 'AI Skill Run',
              description: 'No skills/ changes — skipped'
            });

  run-bob:
    name: Run ACP Agent with Skill
    needs: check
    if: needs.check.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    environment: ai-testing
    timeout-minutes: 20
    steps:
      - name: Get job URL
        id: job
        if: github.event_name == 'workflow_run'
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            });
            const job = data.jobs.find(j => j.name === 'Run ACP Agent with Skill');
            core.setOutput('url', job?.html_url ?? `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`);

      - name: Set pending status
        if: github.event_name == 'workflow_run'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: '${{ github.event.workflow_run.head_sha }}',
              state: 'pending',
              context: 'AI Skill Run',
              description: 'Running AI skill test...',
              target_url: '${{ steps.job.outputs.url }}'
            });

      - name: Check out base branch (trusted action code)
        uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
          path: base

      - name: Check out PR skills only (sparse checkout, markdown only)
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
          path: pr
          sparse-checkout: skills
          sparse-checkout-cone-mode: true
          allow-unsafe-pr-checkout: true

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Build test AI framework JAR using main branch
        if: github.event_name == 'workflow_run'
        working-directory: base/tests
        run: mvn -B package -DskipTests

      - name: Build test AI framework JAR (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        working-directory: pr/tests
        run: mvn -B package -DskipTests

      - name: Resolve execution context
        id: ctx
        run: |
          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            TESTS_DIR="${GITHUB_WORKSPACE}/base/tests"
          else
            TESTS_DIR="${GITHUB_WORKSPACE}/pr/tests"
          fi
          SKILLS_DIR="${GITHUB_WORKSPACE}/pr/skills"

          JAR_PATH=$(find "${TESTS_DIR}/target" -maxdepth 1 -name 'migration-tests-*.jar' -not -name 'original-*' | head -1)
          if [[ -z "$JAR_PATH" ]]; then
            echo "::error::Test AI framework JAR not found"
            exit 1
          fi

          echo "tests_dir=${TESTS_DIR}" >> "$GITHUB_OUTPUT"
          echo "skills_dir=${SKILLS_DIR}" >> "$GITHUB_OUTPUT"
          echo "jar_path=${JAR_PATH}" >> "$GITHUB_OUTPUT"
          echo "Found JAR: ${JAR_PATH}"

      - name: Install ACP client and IBM Bob agent
        uses: ./base/.github/actions/acp-agent-action
        with:
          bobshell_version: '2.0.5'
          smallrye_acp_version: '0.2.0'

      - name: Execute SKILL
        env:
          BOBSHELL_API_KEY: ${{ secrets.BOBSHELL_API_KEY }}
          PROJECT_NAME: spring-rest-api
          JAR_PATH: ${{ steps.ctx.outputs.jar_path }}
          TESTS_DIR: ${{ steps.ctx.outputs.tests_dir }}
          SKILLS_DIR: ${{ steps.ctx.outputs.skills_dir }}
        run: |
          set -euo pipefail
          cd "${TESTS_DIR}"

          echo "Run the dummy SKILL to verify that everything is working with IBM Bob"
          java -Dai.agent=ibm-bob \
               -Dai.prompt="Say Hello" \
               -Dai.projects=dummy \
               -Dai.skills="${TESTS_DIR}/skills/dummy" \
               -Dai.review=false \
               -jar "${JAR_PATH}"

          echo "Migrate the project: ${PROJECT_NAME} and ask AI to review it"
          java -Dai.agent=ibm-bob \
               -Dai.projects=${PROJECT_NAME} \
               -Dai.skills="${SKILLS_DIR}/migrate-spring-to-quarkus" \
               -Dai.review=true \
               -jar "${JAR_PATH}"

      - name: Set final status
        if: github.event_name == 'workflow_run' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const failed = '${{ job.status }}' === 'failure';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: '${{ github.event.workflow_run.head_sha }}',
              state: failed ? 'failure' : 'success',
              context: 'AI Skill Run',
              description: failed ? 'AI skill test failed' : 'AI skill test passed',
              target_url: '${{ steps.job.outputs.url }}'
            });

      - name: Post PR comment with results
        if: github.event_name == 'workflow_run' && always()
        uses: actions/github-script@v7
        env:
          TESTS_DIR: ${{ steps.ctx.outputs.tests_dir }}
          JOB_URL: ${{ steps.job.outputs.url }}
          PROJECT_NAME: spring-rest-api
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const sha = '${{ github.event.workflow_run.head_sha }}';
            const failed = '${{ job.status }}' === 'failure';

            // Find the PR associated with this commit
            const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: sha,
            });
            if (prs.length === 0) {
              core.info('No PR found for this commit — skipping comment');
              return;
            }
            const prNumber = prs[0].number;

            // Collect report files
            const runsDir = path.join(process.env.TESTS_DIR, 'target', 'runs');
            let reportContent = '';
            let reportFiles = [];

            if (fs.existsSync(runsDir)) {
              reportFiles = fs.readdirSync(runsDir)
                .filter(f => f.includes(process.env.PROJECT_NAME))
                .sort();

              const reportMd = reportFiles.find(f => f.endsWith('.report.md'));
              if (reportMd) {
                reportContent = fs.readFileSync(path.join(runsDir, reportMd), 'utf8');
              }
            }

            const emoji = failed ? '❌' : '✅';
            const status = failed ? 'failed' : 'succeeded';

            let body = `## ${emoji} AI Skill Test Results\n\n`;
            body += `Job running dummy skill and migration of **${process.env.PROJECT_NAME}** ${status}.\n\n`;
            body += `### Command\n\n`;
            body += '```bash\n';
            body += `java -Dai.agent=ibm-bob \\\n`;
            body += `     -Dai.projects=${process.env.PROJECT_NAME} \\\n`;
            body += `     -Dai.skills=migrate-spring-to-quarkus \\\n`;
            body += `     -Dai.review=true \\\n`;
            body += `     -jar migration-tests.jar\n`;
            body += '```\n\n';
            body += `📋 [See job result](${process.env.JOB_URL})\n\n`;

            if (reportContent) {
              body += `### Migration Report\n\n`;
              body += `<details>\n<summary>Click to expand</summary>\n\n`;
              body += reportContent.substring(0, 60000);
              body += `\n</details>\n\n`;
            }

            if (reportFiles.length > 0) {
              body += `### Generated Files\n\n`;
              reportFiles.forEach(f => { body += `- \`${f}\`\n`; });
              body += `\nFull reports available in the [run-reports artifact](${process.env.JOB_URL}).\n`;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: body,
            });

      - name: Upload run reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: run-reports-${{ github.run_id }}
          path: ${{ steps.ctx.outputs.tests_dir }}/target/runs/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload AI workdir outputs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: workdir-outputs-${{ github.run_id }}
          path: ${{ steps.ctx.outputs.tests_dir }}/target/workdirs/
          if-no-files-found: warn
          retention-days: 30